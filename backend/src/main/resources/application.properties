spring.application.name=tradepro-backend
server.port=${PORT:8080}

# ---- Database (Neon / Supabase PostgreSQL) ----
# For local dev, credentials live in application-local.properties (gitignored)
# and are activated with the "local" profile. In other environments, set the
# DB_URL / DB_USERNAME / DB_PASSWORD environment variables.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
# Batch writes for fewer round-trips (faster order/watchlist inserts).
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Don't log SQL in production (perf + noise).
spring.jpa.show-sql=false

# ---- Connection pool (Neon free tier has limited connections) ----
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1700000
spring.datasource.hikari.connection-timeout=20000

# ---- Compression (smaller/faster API responses) ----
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=1024

# ---- JWT ----
# IMPORTANT: use a long random string (>= 32 chars) in production.
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-at-least-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# ---- CORS (comma separated) ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---- Razorpay ----
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# ---- Twelve Data (server-side, for the price-alert scheduler) ----
app.twelvedata.api-key=${TWELVE_DATA_API_KEY:}
app.alerts.check-interval-ms=${ALERTS_CHECK_INTERVAL_MS:60000}

# ---- Gemini AI chatbot (server-side only) ----
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-flash-latest}

# ---- Password reset ----
# When true (dev), the forgot-password endpoint returns the reset token in the
# response so you can test without email. Set to false in production.
app.expose-reset-token=${EXPOSE_RESET_TOKEN:true}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ---- SMTP email (for password reset) ----
# Set app.mail.enabled=true and fill these to actually send emails.
# For Gmail: host=smtp.gmail.com, port=587, username=your@gmail.com,
# password=<Gmail App Password> (not your normal password).
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@tradepro.local}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
